<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Egypt Car Market — Live Watch</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0e1116;color:#e6e6e6}
.wrap{max-width:860px;margin:0 auto;padding:24px}
h1{font-size:1.4rem} h2{border-bottom:1px solid #2a2f3a;padding-bottom:6px;margin-top:36px}
.meta{color:#8a93a5;font-size:.85rem}
.meta{unicode-bidi:plaintext;direction:ltr}
.meta.ar{direction:rtl;unicode-bidi:plaintext}
.card{background:#171b22;border:1px solid #262c38;border-radius:10px;padding:12px 14px;margin:10px 0}
.card .price{color:#4ade80;font-weight:700}
.card a{color:#7cc4ff;text-decoration:none;word-break:break-all}
.tag{display:inline-block;background:#232a36;color:#aeb8c8;border-radius:6px;padding:2px 8px;margin-right:6px;font-size:.75rem}
.bad{border-color:#7f1d1d}.bad .price{color:#f87171}
.pick{border-color:#166534}
.top{display:flex;gap:10px;flex-wrap:wrap}
.top .card{flex:1 1 240px}
section{break-inside:avoid}
footer{margin-top:40px;color:#66708a;font-size:.8rem}
.update{background:#132a1d;border:1px solid #1d4d33;color:#a7f3d0;border-radius:10px;padding:10px 14px;margin:14px 0;font-size:.9rem}
</style></head>
<body><div class="wrap">
<h1>🚗 Egypt Car Market — Live Watch</h1>
<div class="meta">Budget <b>200k–250k</b> stretch 300k EGP · Searches: <span id="queries"></span> · Updated <span id="updated">—</span> (Cairo time)</div>
<div id="alerts"></div>
<div id="content">Loading…</div>
<footer>Auto-updated every 6h by the watch agent · <a href="https://github.com/ahmedalghoraib-boop/egypt-car-market" style="color:#7cc4ff">source repo</a></footer>
</div>
<script>
const ORDER = ["astra","e36","civic","cruze","sonic"];
const NAMES = {astra:"Opel Astra", e36:"BMW E36", civic:"Honda Civic", cruze:"Chevrolet Cruze", sonic:"Chevrolet Sonic"};
async function load(){
  const r = await fetch("listings.json");
  const data = await r.json();
  document.getElementById("updated").textContent = data.updated ? fmtDate(data.updated) : "—";
  const q = document.getElementById("queries"); q.innerHTML =
    ['honda civic 1995+','bmw e36','opel astra (auto)','chevrolet cruze 2014+ (auto)','chevrolet sonic (auto)']
    .map(x=>`<span class="tag">${x}</span>`).join("");
  const alerts = document.getElementById("alerts");
  (data.recent||[]).forEach(a => {
    const d = document.createElement("div");
    d.className = "update"; d.innerHTML = "🆕 " + escapeHtml(a);
    alerts.appendChild(d);
  });
  const c = document.getElementById("content");
  ORDER.forEach(model => {
    const items = (data.listings||[]).filter(x => x.model_key === model)
      .sort((a,b) => (a.price - b.price) || b.first_seen.localeCompare(a.first_seen));
    if (!items.length && !(data.flagged||[]).length) return;
    const h = document.createElement("h2"); h.textContent = NAMES[model]; c.appendChild(h);
    items.forEach(it => c.appendChild(card(it)));
  });
  if (data.notes) {
    const n = document.createElement("h2"); n.textContent = "Notes"; c.appendChild(n);
    (data.notes||[]).forEach(t => { const d = document.createElement("div"); d.className="card"; d.textContent = t; c.appendChild(d); });
  }
}
function card(it){
  const div = document.createElement("div");
  div.className = "card" + (it.bad ? " bad" : it.pick ? " pick" : "");
  const kmFmt = it.km ? it.km.toLocaleString("en-US") + "km" : "";
  const tags = [it.transmission && it.transmission.toUpperCase(), it.year && String(it.year), it.cc && it.cc+"cc", it.km && kmFmt, it.color, it.body, it.location, it.status !== "active" ? it.status : ""].filter(Boolean).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("");
  const extras = [it.price_type === "قابل للنقاش" ? "negotiable 💬" : "", it.inspection ? "📍 inspection: " + it.inspection : ""].filter(Boolean).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("");
  div.innerHTML = `<div><b>${escapeHtml(it.title)}</b> — <span class="price">${it.price ? it.price.toLocaleString() + " EGP" : "—"}</span></div>
    <div class="tagrow">${tags}${extras}</div>
${it.condition ? `<div class="meta${isArabic(it.condition) ? " ar" : ""}" dir="${isArabic(it.condition) ? "rtl" : "auto"}">${escapeHtml(it.condition)}</div>` : ""}
    <div>${it.platform ? `<span class="tag">source: ${escapeHtml(it.platform)}</span>` : ""} ${it.url ? `<a href="${it.url}" target="_blank">view listing →</a>` : ""}</div>
    ${it.seller_name ? `<div class="meta">☎ contact: ${escapeHtml(it.seller_name)}${it.seller_phone ? " · " + escapeHtml(it.seller_phone) : " (message via platform)"}</div>` : ""}`;
  return div;
}
function fmtDate(iso){
  const d = new Date(iso);
  const cairo = new Date(d.toLocaleString("en-US",{timeZone:"Africa/Cairo"}));
  const p = n => String(n).padStart(2,"0");
  let h = cairo.getHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return `${cairo.getDate()}/${p(cairo.getMonth()+1)}/${cairo.getFullYear()} ${p(h)}:${p(cairo.getMinutes())} ${ap}`;
}
function isArabic(s){return /[\u0600-\u06FF]/.test(s || "")}
function escapeHtml(s){return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
load();
</script>
</body></html>
